[project]
name = "kut-backend"
version = "0.1.0"
description = "Kut ERP backend: modular monolith on FastAPI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "sqlalchemy[asyncio]>=2.0.54,<2.1",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "celery[redis]>=5.6",
    "redis>=5",
    "boto3>=1.43",
    "pyyaml>=6.0",
    "openpyxl>=3.1.5",
    "defusedxml>=0.7.1",
    "argon2-cffi>=25.1",
    "pyjwt[crypto]>=2.10",
    "pyotp>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
    "ruff>=0.16",
    "mypy>=2.3",
    "boto3-stubs[s3]>=1.43",
    "celery-types>=0.26",
    "types-pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
# Комментарии и docstring на русском: RUF001-003 принимают кириллические буквы за латинские.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# DDL собирается только из констант модуля; длинные строки внутри SQL не переносим.
"migrations/**" = ["S608", "E501"]
# S105: константы с SQL-функциями называются по сути (AUTH_PASSWORD_HASH), это не пароли.
"migrations/versions/*" = ["F401", "S105"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
