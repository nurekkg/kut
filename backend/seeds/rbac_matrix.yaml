# Роли и матрица прав (ТЗ §7.3, ADR-001 §3). Источник истины для сида: PO подписывает этот файл.
# Загрузка идемпотентна: `python -m app.modules.rbac.seed` (её запускает сервис migrate после alembic).
#
# Ячейки матрицы записаны ровно так, как в ТЗ §7.3:
#   R      read              R/W    read + write              —    нет доступа
#   «(свой)» — ограничение «только свои объекты / свой контрагент». Это свойство области видимости
#   (user_project_access, counterparty_id, RLS), а не права, поэтому в role_permission не попадает.
# Остальные глаголы ТЗ (approve, delete, export, admin) матрицей §7.3 не заданы и никому не выданы,
# кроме явных записей в разделе extra.

version: 1

# scope: group — все объекты группы; project — объекты из user_project_access;
#        counterparty — данные своего контрагента (внешние роли, только чтение).
# rank — для маршрутов согласования (владелец > финдир / техдир > руководители отделов > исполнители).
# Решение PO после S1a: техдиректор — scope=group (все объекты, как владелец и финдир).
# ДОПУЩЕНИЕ, НУЖНА ПРОВЕРКА PO: разбиение остальных внутренних ролей на «руководителей отделов» (50)
# и «исполнителей» (30).
roles:
  - {code: owner, name: "Владелец / руководитель", scope: group, rank: 100, requires_2fa: true}
  - {code: finance_director, name: "Финансовый директор", scope: group, rank: 90, requires_2fa: true}
  - {code: technical_director, name: "Технический директор / гл. инженер", scope: group, rank: 90}
  - {code: foreman, name: "Прораб", scope: project, rank: 50}
  - {code: master, name: "Мастер", scope: project, rank: 30}
  - {code: estimator, name: "Сметчик / ПТО", scope: project, rank: 50}
  - {code: procurement, name: "Снабженец", scope: project, rank: 50}
  - {code: storekeeper, name: "Кладовщик", scope: project, rank: 30}
  - {code: accountant, name: "Бухгалтер", scope: project, rank: 50, requires_2fa: true}
  - {code: lawyer, name: "Юрист", scope: project, rank: 50}
  - {code: customer, name: "Представитель заказчика / инвестора", scope: counterparty, rank: 0}
  - {code: subcontractor, name: "Субподрядчик", scope: counterparty, rank: 0}
  - {code: supplier, name: "Поставщик", scope: counterparty, rank: 0}

