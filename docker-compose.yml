name: kut

x-backend-build: &backend-build
  context: ./backend

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kut}:${POSTGRES_PASSWORD:-kut_dev_password}@postgres:5432/${POSTGRES_DB:-kut}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  S3_ENDPOINT_URL: http://minio:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-kut-files}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-kut_dev_access}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-kut_dev_secret_key}

x-backend-volumes: &backend-volumes
  - ./backend/app:/app/app
  - ./backend/tests:/app/tests
  - ./backend/migrations:/app/migrations

x-minio-image: &minio-image pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kut}
      POSTGRES_USER: ${POSTGRES_USER:-kut}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kut_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: *minio-image
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-kut_dev_access}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-kut_dev_secret_key}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio-init:
    image: *minio-image
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-kut_dev_access}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-kut_dev_secret_key}
      S3_BUCKET: ${S3_BUCKET:-kut-files}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" && mc mb --ignore-existing "local/$$S3_BUCKET"
    restart: "no"

  migrate:
    build: *backend-build
    image: kut-backend:dev
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *backend-build
    image: kut-backend:dev
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    environment:
      <<: *backend-env
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    build: *backend-build
    image: kut-backend:dev
    command: ["celery", "-A", "app.core.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *backend-env
    volumes: *backend-volumes
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD-SHELL", "celery -A app.core.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./frontend
    image: kut-frontend:dev
    environment:
      API_INTERNAL_URL: http://api:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/messages:/app/messages
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 90s

volumes:
  pgdata:
  redisdata:
  miniodata:
