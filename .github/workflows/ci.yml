name: CI

on:
  push:
    branches: [main, 'phase-*', 'se-*', 's5*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('ci-dispatch-{0}', github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kut
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      UV_FROZEN: "1"
      APP_ENV: test
      # Одноразовые учётки job-а (контейнер postgres живёт только на время прогона). Суперпользователь
      # postgres нужен лишь шагу bootstrap; приложение и тесты работают под ролями kut_*.
      KUT_OWNER_PASSWORD: ci_owner_password
      KUT_APP_PASSWORD: ci_app_password
      KUT_PORTAL_PASSWORD: ci_portal_password
      KUT_WORKER_PASSWORD: ci_worker_password
      DATABASE_URL: postgresql+psycopg://kut_app:ci_app_password@localhost:5432/kut_test
      DATABASE_PORTAL_URL: postgresql+psycopg://kut_portal:ci_portal_password@localhost:5432/kut_test
      TEST_DATABASE_OWNER_URL: postgresql+psycopg://kut_owner:ci_owner_password@localhost:5432/kut_test
      TEST_DATABASE_WORKER_URL: postgresql+psycopg://kut_worker:ci_worker_password@localhost:5432/kut_test
      # Ключи JWT и TOTP: dev-плейсхолдеры из .env.example (kid dev-1), как у сервиса test в compose.
      # Тесты ждут kid dev-1 и проверяют, что production отказывается от dev-ключей.
      JWT_PRIVATE_KEYS: dev-1:GLp4ipa8ygJMpz5w-usHPDsFMC-QZyMJLNMKBU33drQ
      JWT_ACTIVE_KID: dev-1
      TOTP_ENCRYPTION_KEYS: dev-1:J4WKMm-ZdEWech8b3xRh2jNaRBI8NTBQQE46PaqMRGc
      TOTP_ACTIVE_KEY_ID: dev-1
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      S3_ENDPOINT_URL: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: kut-files
      S3_ACCESS_KEY: ci_access_key
      S3_SECRET_KEY: ci_secret_key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy app
      - name: Start MinIO and create bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$S3_SECRET_KEY" \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live && break
            sleep 1
          done
          docker exec minio mc alias set local http://localhost:9000 "$S3_ACCESS_KEY" "$S3_SECRET_KEY"
          docker exec minio mc mb --ignore-existing "local/$S3_BUCKET"
      - name: Bootstrap database roles
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: kut
          KUT_BOOTSTRAP_TEST_DB: "1"
        run: psql -X -q -v ON_ERROR_STOP=1 -f ../db/bootstrap.sql
      - name: Pytest (случайный порядок, seed печатается)
        run: |
          SEED="$(od -An -N2 -tu2 /dev/urandom | tr -d ' ')"
          echo "pytest-randomly seed: $SEED"
          uv run pytest -q --randomly-seed="$SEED"
      - name: Alembic upgrade, downgrade, upgrade, seeds
        env:
          DATABASE_URL: postgresql+psycopg://kut_owner:ci_owner_password@localhost:5432/kut
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run python -m app.modules.rbac.seed
      - name: Alembic check (models match migrations)
        env:
          DATABASE_URL: postgresql+psycopg://kut_owner:ci_owner_password@localhost:5432/kut
        run: uv run alembic check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Вся история, не только HEAD: секрет в старом коммите остаётся в репозитории.
      # Разобранные находки - в .gitleaksignore с причинами; новая неразобранная находка роняет job.
      - name: gitleaks по истории
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --redact --verbose /repo

  # Сквозные проверки на полном наборе Playwright против стенда как в compose: Postgres, Redis, MinIO,
  # API без reload (keep-alive как в Dockerfile), dev-сиды, web как production build. Секреты - только
  # dev-плейсхолдеры из .env.example; артефакты загружаются только при падении.
  e2e:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Dev placeholders
        run: cp .env.example .env
      - name: Build images
        run: docker compose build migrate api dev-seed web
      - name: Postgres, Redis, MinIO
        run: |
          docker compose up -d --wait postgres redis minio
          docker compose run --rm --no-deps minio-init
          docker compose run --rm --no-deps db-bootstrap
          docker compose run --rm --no-deps migrate
      - name: API (production command, keep-alive as in the Dockerfile)
        run: |
          docker compose run -d --no-deps --use-aliases --service-ports --name kut-api api uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 65
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health/ready; then exit 0; fi
            sleep 2
          done
          docker logs kut-api
          exit 1
      - name: Dev seed and schedule load
        run: |
          docker compose run --rm --no-deps dev-seed
          docker compose run --rm --no-deps dev-seed python -m app.modules.schedule.devseed_load
      - name: Web (production build and start)
        run: |
          docker compose run -d --no-deps --service-ports --name kut-web web sh -c "npm run build && npx next start -p 3000 -H 0.0.0.0"
          for _ in $(seq 1 480); do
            if curl -fsS http://127.0.0.1:3100/login > /dev/null; then exit 0; fi
            sleep 5
          done
          docker logs kut-web --tail 200
          exit 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E (full set, no retries)
        working-directory: e2e
        run: |
          export DEV_SEED_PASSWORD="$(grep '^DEV_SEED_PASSWORD=' ../.env | cut -d= -f2-)"
          export DEV_SEED_TOTP_SECRET="$(grep '^DEV_SEED_TOTP_SECRET=' ../.env | cut -d= -f2-)"
          npx playwright test --retries=0
      - name: Замер календаря в лог
        if: always()
        working-directory: e2e
        run: cat artifacts/equipment-timing.json || echo "замер не записан"
      - name: Failure diagnostics
        if: failure()
        run: |
          mkdir -p e2e/artifacts
          docker compose logs --no-color > e2e/artifacts/compose.log 2>&1 || true
          docker logs kut-api > e2e/artifacts/api.log 2>&1 || true
          docker logs kut-web > e2e/artifacts/web.log 2>&1 || true
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-failure
          path: e2e/artifacts/
          retention-days: 7
      # Снимки экранов (шаги shot()) - при ручном запуске всегда, даже когда тесты зелёные: их смотрят глазами.
      - name: Upload screenshots (manual run)
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-screens
          path: e2e/artifacts/screens/
          retention-days: 7
          if-no-files-found: warn
